
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: linear-gradient(135deg, #ff9ec8, #ffc8df, #e9b4ff);
  font-family: Arial, sans-serif;
}

.sorry {
  font-size: clamp(4rem, 15vw, 10rem);
  font-weight: 900;
  color: white;
  letter-spacing: 8px;
  text-shadow: 0 0 20px #ff4f99;
  animation: sorryAnimation 2s ease-in-out infinite;
}

@keyframes sorryAnimation {
  0% {
    transform: scale(.5);
    opacity: 0;
  }

  50% {
    transform: scale(1.15);
    opacity: 1;
  }

  75% {
    transform: scale(.95);
  }

  100% {
    transform: scale(1);
    opacity: 1;
  }
}
</style>
</head>

<body>

<div class="sorry">SORRY BBE</div>

</body>
</html>
